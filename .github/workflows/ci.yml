name: CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: develop-club_management-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      # Alineado a prod/dev (PostgreSQL v14). MariaDB provocaba fallos masivos
      # por SQL PG-only (Socio) y faltaban tablas de ERPNext en el site de test.
      postgresql:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install PostgreSQL client
        run: |
          sudo apt update
          sudo apt-get install -y postgresql-client libpq-dev

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          cd ~/frappe-bench
          bench set-config -g db_host 127.0.0.1
          bench set-config -g db_port 5432
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:11000

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --branch version-16 https://github.com/frappe/erpnext.git
          bench get-app club_management $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site test_site \
            --db-type postgres \
            --db-host 127.0.0.1 \
            --db-port 5432 \
            --db-root-username postgres \
            --db-root-password root \
            --admin-password admin \
            --install-app erpnext
          bench --site test_site install-app club_management
          bench build
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app club_management
        env:
          TYPE: server
